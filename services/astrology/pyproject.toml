[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nakshatra-astrology-api"
version = "0.1.0"
description = "Vedic chart calculations using Swiss Ephemeris"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pyswisseph==2.10.3.2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.1; platform_system == 'Windows'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
